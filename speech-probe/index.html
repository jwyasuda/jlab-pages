<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Speech Probe">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="../apple-touch-icon-180.png">
<title>Speech Probe</title>
<!-- Throwaway POC (2026-11-14): does webkitSpeechRecognition work in a home-screen web app on iOS,
     and what does Japanese dictation output look like? Not part of the Reader. -->
<style>
  :root { color-scheme: dark; --bg: #111; --fg: #eee; --dim: #999; --acc: #4da3ff; --ok: #3c9; --bad: #e66; }
  body { background: var(--bg); color: var(--fg); font: 16px -apple-system, system-ui, sans-serif;
         margin: 0; padding: 16px; padding-top: max(16px, env(safe-area-inset-top)); }
  h1 { font-size: 20px; margin: 0 0 12px; }
  h2 { font-size: 15px; color: var(--dim); margin: 20px 0 8px; text-transform: uppercase; letter-spacing: .04em; }
  .env div { font-size: 14px; }
  .yes { color: var(--ok); } .no { color: var(--bad); }
  select, textarea, button { font: inherit; width: 100%; box-sizing: border-box; border-radius: 10px; }
  select, textarea { background: #222; color: var(--fg); border: 1px solid #444; padding: 10px; }
  textarea { min-height: 70px; font-size: 20px; }
  .target { font-size: 22px; margin: 10px 0; }
  button { background: var(--acc); color: #000; border: 0; padding: 14px; font-weight: 600; margin-top: 8px; }
  button.secondary { background: #333; color: var(--fg); }
  button.listening { background: var(--bad); }
  .out { font-size: 20px; min-height: 28px; margin-top: 10px; }
  .alts { font-size: 15px; color: var(--dim); }
  .diff span.m { color: var(--ok); } .diff span.x { color: var(--bad); text-decoration: underline; }
  pre { white-space: pre-wrap; font-size: 12px; color: var(--dim); background: #1a1a1a; padding: 8px; border-radius: 8px; }
</style>
</head>
<body>
<h1>Speech Probe</h1>

<h2>Environment</h2>
<div class="env" id="env"></div>

<h2>Sentence</h2>
<select id="pick">
  <option>詰めが甘いんです</option>
  <option>それは あまり 得策とは言いかねますね</option>
  <option>お言葉を返すようですが</option>
  <option>そうしたいのは やまやまですが</option>
</select>
<div class="target" id="target"></div>

<h2>A · Speak button (web speech recognition)</h2>
<button id="speak">🎙 Speak</button>
<div class="out" id="speechOut"></div>
<div class="alts" id="speechAlts"></div>
<div class="diff" id="speechDiff"></div>

<h2>B · Keyboard dictation (tap the box, then the keyboard mic)</h2>
<textarea id="typed" lang="ja" placeholder="Tap here, switch to the Japanese keyboard, tap 🎙"></textarea>
<button id="check" class="secondary">Check</button>
<div class="diff" id="typedDiff"></div>

<h2>Log</h2>
<pre id="log"></pre>
<button id="copy" class="secondary">Copy log</button>

<script>
const $ = (id) => document.getElementById(id);
const lines = [];
function log(msg) {
  lines.push(`${new Date().toISOString().slice(11, 23)} ${msg}`);
  $('log').textContent = lines.join('\n');
}

const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
const standalone = window.navigator.standalone === true || matchMedia('(display-mode: standalone)').matches;
const env = [
  ['Home-screen app (standalone)', standalone],
  ['Secure context (https)', window.isSecureContext],
  ['SpeechRecognition', 'SpeechRecognition' in window],
  ['webkitSpeechRecognition', 'webkitSpeechRecognition' in window],
  ['getUserMedia', !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia)],
];
$('env').innerHTML = env.map(([k, v]) => `<div>${k}: <b class="${v ? 'yes' : 'no'}">${v ? 'yes' : 'no'}</b></div>`).join('')
  + `<div style="color:var(--dim);font-size:12px;margin-top:6px">${navigator.userAgent}</div>`;
env.forEach(([k, v]) => log(`${k}: ${v}`));
log(`UA: ${navigator.userAgent}`);

function showTarget() { $('target').textContent = $('pick').value; }
$('pick').addEventListener('change', showTarget);
showTarget();

// Character comparison ignoring spaces and punctuation; a real app would compare readings (kana).
const norm = (s) => s.replace(/[\s、。，．,.!?！？…「」『』]/g, '');
function diff(target, said) {
  const a = [...norm(target)], b = [...norm(said)];
  const dp = Array.from({ length: a.length + 1 }, () => new Array(b.length + 1).fill(0));
  for (let i = a.length - 1; i >= 0; i--)
    for (let j = b.length - 1; j >= 0; j--)
      dp[i][j] = a[i] === b[j] ? dp[i + 1][j + 1] + 1 : Math.max(dp[i + 1][j], dp[i][j + 1]);
  const hit = new Array(a.length).fill(false);
  for (let i = 0, j = 0; i < a.length && j < b.length;) {
    if (a[i] === b[j]) { hit[i] = true; i++; j++; } else if (dp[i + 1][j] >= dp[i][j + 1]) i++; else j++;
  }
  const n = hit.filter(Boolean).length;
  return `<div>${a.map((c, i) => `<span class="${hit[i] ? 'm' : 'x'}">${c}</span>`).join('')}</div>`
    + `<div class="alts">${n}/${a.length} characters matched</div>`;
}

let rec = null;
$('speak').addEventListener('click', () => {
  if (!SR) { log('Speak: no SpeechRecognition constructor'); $('speechOut').textContent = 'Not supported here.'; return; }
  if (rec) { rec.stop(); return; }
  try {
    rec = new SR();
  } catch (e) { log(`new SpeechRecognition threw: ${e}`); return; }
  rec.lang = 'ja-JP';
  rec.interimResults = true;
  rec.continuous = false;
  rec.maxAlternatives = 5;
  $('speechOut').textContent = ''; $('speechAlts').textContent = ''; $('speechDiff').innerHTML = '';
  ['start', 'audiostart', 'soundstart', 'speechstart', 'speechend', 'soundend', 'audioend', 'nomatch']
    .forEach((ev) => rec.addEventListener(ev, () => log(`event: ${ev}`)));
  rec.onresult = (e) => {
    const r = e.results[e.results.length - 1];
    const alts = [...r].map((a) => `${a.transcript} (${a.confidence.toFixed(2)})`);
    $('speechOut').textContent = r[0].transcript;
    log(`result final=${r.isFinal}: ${alts.join(' | ')}`);
    if (r.isFinal) {
      $('speechAlts').textContent = alts.length > 1 ? `Alternatives: ${alts.slice(1).join(' · ')}` : '';
      $('speechDiff').innerHTML = diff($('pick').value, r[0].transcript);
    }
  };
  rec.onerror = (e) => { log(`error: ${e.error} ${e.message || ''}`); $('speechOut').textContent = `Error: ${e.error}`; };
  rec.onend = () => { log('event: end'); rec = null; $('speak').classList.remove('listening'); $('speak').textContent = '🎙 Speak'; };
  try {
    rec.start();
    $('speak').classList.add('listening'); $('speak').textContent = '■ Stop';
    log('start() called');
  } catch (e) { log(`start() threw: ${e}`); rec = null; }
});

$('check').addEventListener('click', () => {
  const said = $('typed').value;
  log(`keyboard: ${said}`);
  $('typedDiff').innerHTML = diff($('pick').value, said);
});

$('copy').addEventListener('click', async () => {
  try { await navigator.clipboard.writeText(lines.join('\n')); $('copy').textContent = 'Copied'; }
  catch { $('copy').textContent = 'Copy failed — select the log text instead'; }
});
</script>
</body>
</html>
